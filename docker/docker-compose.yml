# Docker Compose для локального запуска frontend + backend
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: yourjob
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    container_name: yourjob_backend
    env_file:
      - ../backend/simple.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/media:/app/media
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: yourjob_frontend
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE=/api
      - HOST=0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - ../frontend/.env.local:/app/.env.local
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
